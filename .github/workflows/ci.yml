name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Reject tracked secret files and high-confidence credentials
        shell: bash
        run: |
          tracked_secret_files=$(git ls-files | awk '
            BEGIN { IGNORECASE=1 }
            /(^|\/)\.env($|\.)|\.(pem|key|p12|pfx|jks|keystore|tfstate)($|\.)|(^|\/)(credentials\.json|service-account.*\.json|kubeconfig|\.vault-token)$/ {
              if ($0 !~ /(^|\/)\.env(\..+)?\.example$/) print
            }
          ')
          if [ -n "$tracked_secret_files" ]; then
            echo "Tracked secret-like files are not allowed:"
            echo "$tracked_secret_files"
            exit 1
          fi

          if git grep -I -q -E \
            '(gh[pousr]_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----)'; then
            echo "A high-confidence credential pattern was detected; values are intentionally redacted."
            exit 1
          fi

  backend:
    name: Backend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv and locked dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra api --dev

      - name: Compile Python modules
        run: uv run python -m compileall -q agent api ingest eval

      - name: Run deterministic backend contracts
        run: >-
          uv run pytest -q
          tests/test_answerability.py
          tests/test_chat_contract.py
          tests/test_chat_streaming.py
          tests/test_citation_validator.py
          tests/test_conversation_prompt.py
          tests/test_edge_case_matrix.py
          tests/test_graph_construction.py
          tests/test_intent_route_fixes.py
          tests/test_internal_api_auth.py
          tests/test_stage2_intent.py
          tests/test_stage4b_gap_closure.py
          tests/test_stage4c0_evaluation_foundation.py
          tests/test_stage4c1_router_evaluation.py
          tests/test_stage4c3_telemetry.py
          tests/test_stage4c4_router_experiment.py
          tests/test_memory_config.py
          tests/test_memory_context_assembler.py
          tests/test_memory_controls.py
          tests/test_memory_profile.py
          tests/test_memory_store.py
          tests/test_memory_supersession.py
          tests/test_memory_transcript_writer.py
          tests/test_memory_writer.py
          tests/test_persistent_transcript.py
          tests/test_query_policy.py
          tests/test_query_router.py
          tests/test_session_identity.py
          tests/test_session_registry.py
          tests/test_sources.py
          tests/research

      - name: Validate conversational-memory eval dataset
        run: uv run python eval/conversational_memory_eval.py

      - name: Validate router eval dataset
        run: uv run python eval/router_eval.py

      - name: Run deterministic memory behavior eval
        run: uv run python eval/memory_eval.py --run-behavior --hard-gates --out /tmp/memory-eval.json

      - name: Gate memory contradiction resolution
        run: >-
          uv run python eval/memory_gate.py
          /tmp/memory-eval.json
          --min-contradiction-accuracy 1.0

      - name: Verify Postgres memory integration
        env:
          MEMORY_TEST_DATABASE_URL: postgresql://research:research@localhost:5432/research_memory
        run: >-
          uv run pytest -q
          tests/integration/test_postgres_store_integration.py
          tests/integration/test_postgres_profile_memory.py
          tests/integration/test_postgres_memory_supersession.py

      - name: Verify API imports
        run: uv run python -c "from api.main import app; assert app is not None"

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      AUTH_SECRET: ci-test-placeholder
      AUTH_GITHUB_ID: ci-test-placeholder
      AUTH_GITHUB_SECRET: ci-test-placeholder
      BACKEND_INTERNAL_TOKEN: ci-test-placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend contract tests
        run: >-
          node --test
          src/app/api/chat/route.test.mjs
          src/app/chat/session-id.test.mjs
          src/lib/backend-request.test.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [secrets, backend]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ai-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend container
        run: |
          docker run -d --name ai-agent-ci -p 8000:8000 \
            -e APP_ENV=production \
            -e BACKEND_INTERNAL_TOKEN=ci-test-placeholder \
            ai-research-agent:ci
          trap 'docker logs ai-agent-ci || true; docker rm -f ai-agent-ci || true' EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://localhost:8000/health >/tmp/health.json; then
              if curl --fail --silent http://localhost:8000/api/features >/dev/null; then
                echo "Protected API accepted a request without its internal token"
                exit 1
              fi
              curl --fail --silent \
                -H "X-Internal-Token: ci-test-placeholder" \
                http://localhost:8000/api/features >/dev/null
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy"
          exit 1
