[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Agentic RAG system for research papers (arXiv-focused)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.11.15,<0.12",
    "langgraph>=0.2.0,<0.3",
    "langchain>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "chromadb>=0.5.5,<0.6",
    "sentence-transformers>=2.7.0,<3",
    "rank-bm25>=0.2.2",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "ollama>=0.3.3",
    "tavily-python>=0.3.5",
    "beautifulsoup4>=4.12.3",
    "unstructured>=0.15.7,<0.16",
    "requests>=2.32.3",
    "psycopg[binary]>=3.2.0,<4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
]
eval = [
    "ragas>=0.1.0",
    "datasets>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false
# onnxruntime (via chromadb) and torch (via sentence-transformers) dropped macOS x86_64
# wheels in recent releases (onnxruntime 1.20+, torch 2.3+). Constrain below those so
# `uv sync` works on Intel Macs; Linux/Docker keep their manylinux wheels either way.
constraint-dependencies = ["onnxruntime<1.20", "torch<2.3"]
